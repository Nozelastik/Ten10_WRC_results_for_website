name: Auto-Generate Results Index
on:
  push:
    paths:
      - 'Ten10_Motorsports_WRC_Results/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Generate JSON Index
        run: |
          node -e "
          const fs = require('fs');
          const path = require('path');
          const rootDir = './Ten10_Motorsports_WRC_Results';
          
          function buildTree(dir) {
            const result = {};
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              const filePath = path.join(dir, file);
              const stat = fs.statSync(filePath);
              if (stat.isDirectory()) {
                result[file] = buildTree(filePath);
              } else if (file.endsWith('.json') && file !== 'index.json') {
                result[file] = file;
              }
            });
            return result;
          }
          
          if (fs.existsSync(rootDir)) {
            const tree = buildTree(rootDir);
            fs.writeFileSync('./Ten10_Motorsports_WRC_Results/index.json', JSON.stringify(tree, null, 2));
          }
          "

      - name: Commit and Push Index
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add ./Ten10_Motorsports_WRC_Results/index.json
          git commit -m "Automated update to results index [skip ci]" || exit 0
          git push
