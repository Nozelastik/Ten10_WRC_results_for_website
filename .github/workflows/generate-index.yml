name: Auto-Generate Results Index

on:
  push:
    paths:
      - 'Ten10_Motorsports_WRC_Results/**'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate JSON Index
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const rootDir = './Ten10_Motorsports_WRC_Results';
          const indexFile = path.join(rootDir, 'index.json');

          function buildTree(dir) {
            const result = {};

            const entries = fs.readdirSync(dir, {
              withFileTypes: true
            });

            entries.forEach(entry => {
              const name = entry.name;

              // Never include the generated index inside itself
              if (name === 'index.json') return;

              const fullPath = path.join(dir, name);

              if (entry.isDirectory()) {
                result[name] = buildTree(fullPath);
              } else if (name.toLowerCase().endsWith('.json')) {
                result[name] = name;
              }
            });

            return result;
          }

          if (!fs.existsSync(rootDir)) {
            throw new Error(`Results root folder not found: ${rootDir}`);
          }

          const tree = buildTree(rootDir);

          fs.writeFileSync(
            indexFile,
            JSON.stringify(tree, null, 2) + '\n',
            'utf8'
          );

          console.log('Generated:', indexFile);
          console.log(JSON.stringify(tree, null, 2));
          NODE

      - name: Show Generated Index
        run: |
          echo "===== index.json ====="
          cat ./Ten10_Motorsports_WRC_Results/index.json
          echo "======================"

      - name: Commit and Push Index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Ten10_Motorsports_WRC_Results/index.json

          if git diff --cached --quiet; then
            echo "No changes to index.json."
            exit 0
          fi

          git commit -m "Update results index [skip ci]"
          git push
